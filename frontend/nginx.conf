server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Static assets — long cache
    location ~* \.(js|css|woff2?|png|jpg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # API proxy → backend container
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Static uploads from backend
    location /static/ {
        proxy_pass http://backend:8000/static/;
    }

    # Vite emits React assets under /app/assets because the app is mounted below /app.
    location ^~ /app/assets/ {
        alias /usr/share/nginx/html/react/assets/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — React app at /app/
    location /app/ {
        alias /usr/share/nginx/html/react/;
        try_files $uri $uri/ /app/index.html;
    }

    # Public profile URLs reuse the React entry while keeping /profile/<username> visible.
    location /profile/ {
        alias /usr/share/nginx/html/react/;
        try_files $uri $uri/ /app/index.html;
    }

    # Cinematic standalone UI as the landing page
    location / {
        root /usr/share/nginx/html/cinema;
        try_files /index.html =404;
    }
}
